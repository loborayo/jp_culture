<main id="content"><div class="intro"><div><span class="overline">WEEKLY ARCHIVE</span><h1>歷史週報</h1><p>按期別回看日本傳統文化消息。</p></div></div><div class="history-grid"><a class="history-card" href="2026-10-05.html"><span class="overline">文化週報</span><h2>2026-10-05 — 2026-10-11</h2><p>16 則消息 · 3 則活動提醒</p><span>閱讀本期 →</span></a><a class="history-card" href="2026-09-28.html"><span class="overline">文化週報</span><h2>2026-09-28 — 2026-10-04</h2><p>17 則消息 · 3 則活動提醒</p><span>閱讀本期 →</span></a></div></main><footer>公開來源精選 · AI 協助整理 · 請以原始公告為準<a class="back-top" href="#top">回到頁首 ↑</a></footer><script>
(()=>{
const theme=document.querySelector('#weekly-theme'),media=matchMedia('(prefers-color-scheme:dark)');
let choice='system';try{choice=localStorage.getItem('weekly-theme')||'system'}catch{}
theme.value=['light','dark','system'].includes(choice)?choice:'system';
function apply(){document.documentElement.dataset.theme=theme.value==='system'?(media.matches?'dark':'light'):theme.value}
theme.addEventListener('change',()=>{apply();try{localStorage.setItem('weekly-theme',theme.value)}catch{}});media.addEventListener('change',apply);apply();
const search=document.querySelector('#search');if(!search)return;
const buttons=[...document.querySelectorAll('.filters button')],sections=[...document.querySelectorAll('.news-section')],total=document.querySelectorAll('.story').length;let selected='all';
function update(){let count=0;const query=search.value.trim().toLocaleLowerCase();for(const section of sections){let visible=0;for(const article of section.querySelectorAll('.story')){const show=(selected==='all'||section.id===selected)&&article.textContent.toLocaleLowerCase().includes(query);article.hidden=!show;if(show)visible++}section.hidden=(selected!=='all'&&section.id!==selected)||(query!==''&&visible===0);section.querySelector('.section-count').textContent=visible+' 則';count+=visible}document.querySelector('.result-count').textContent=`顯示 ${count} 則／共 ${total} 則`;document.querySelector('.no-results').hidden=count!==0||query==='';document.querySelector('.sections').classList.toggle('filtered',selected!=='all')}
for(const button of buttons)button.addEventListener('click',()=>{selected=button.dataset.section;for(const b of buttons)b.setAttribute('aria-pressed',String(b===button));update()});search.addEventListener('input',update);
function reset(){selected='all';search.value='';for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.section==='all'));update()}
function revealHash(){if(!location.hash.startsWith('#story-'))return;reset();const target=document.getElementById(location.hash.slice(1));if(target)requestAnimationFrame(()=>target.scrollIntoView({block:'start'}))}
document.querySelectorAll('.highlights a').forEach(a=>a.addEventListener('click',reset));addEventListener('hashchange',revealHash);update();revealHash();
})();
</script></body></html>
